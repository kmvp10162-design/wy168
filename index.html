<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wynn168</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #120906;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 360px;
      max-width: 90%;
      padding: 30px;
      text-align: center;
      background: #1d110b;
      border: 1px solid #d6a436;
      border-radius: 15px;
    }

    .logo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    h1 {
      color: #ffe58a;
      font-size: 28px;
      margin: 10px 0;
    }

    p {
      color: #ddd;
      margin-bottom: 25px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .register {
      background: #ffd966;
      color: #241600;
    }

    .line {
      background: #a90020;
      color: white;
    }
  </style>
</head>

<body>

  <div class="box">

    <img src="logo.jpg" class="logo" alt="Logo">

    <h1>พร้อมเริ่มต้นแล้วหรือยัง?</h1>

    <p>
      เลือกช่องทางที่ต้องการ
    </p>

    <a
      id="registerBtn"
      class="btn register"
      href="#"
    >
      สมัครสมาชิก
    </a>

    <a
      id="lineBtn"
      class="btn line"
      href="#"
    >
      LINE ติดต่อสอบถาม
    </a>

  </div>

</body>
</html>
